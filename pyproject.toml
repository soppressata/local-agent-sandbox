[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-sandbox"
version = "0.1.0"
description = "Lightweight, sub-10ms local process sandbox for AI coding agents."
readme = "README.md"
authors = [
    { name = "soppressata", email = "312807597+soppressata@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries"
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
memory = ["rmbr>=0.2.0"]

[project.scripts]
agent-sandbox = "local_agent_sandbox.cli:cli"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=local_agent_sandbox"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["local_agent_sandbox*"]
